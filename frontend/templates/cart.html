<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo"><i class="fas fa-store"></i> <span>Shop<span class="highlight">Hub</span></span></a>
            <div class="nav-actions">
                <a href="/dashboard" class="btn btn-outline">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container cart-container">
        <h2 class="page-title">Shopping Cart</h2>
        
        <div class="cart-layout">
            <!-- Cart Items -->
            <div class="cart-items-section">
                <div id="cartItemsList">
                    <!-- Populated by JS -->
                    <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Loading cart...</div>
                </div>
     
<!-- Order Summary -->
<div class="cart-summary-section">
    <div class="summary-card">
        <h3>Order Summary</h3>
        <div class="summary-row">
            <span>Subtotal</span>
            <span id="summarySubtotal">$0.00</span>
        </div>
        <div class="summary-row">
            <span>Shipping Fee</span>
            <span id="summaryShipping">$15.00</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row total">
            <span>Total</span>
            <span id="summaryTotal">$0.00</span>
        </div>
        <button class="btn btn-primary checkout-btn" onclick="window.location.href='/checkout'" id="checkoutBtn" disabled>
            Proceed to Checkout <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
        </button>
        <a href="/dashboard" class="continue-shopping">
            <i class="fas fa-arrow-left"></i> Continue Shopping
        </a>
    </div>
</div>
        </div>
    </div>
    <script src="/static/js/cart.js"></script>
</body>
</html>
