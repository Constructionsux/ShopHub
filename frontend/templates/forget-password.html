<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ShopHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <i class="fas fa-store"></i>
                    <span>Shop<span class="highlight">Hub</span></span>
                </a>
                <h2>Forgot Password?</h2>
                <p>Enter your email and we'll send you a reset code.</p>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                    Send Reset Code
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
