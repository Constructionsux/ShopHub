<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <i class="fas fa-store"></i>
                    <span>Shop<span class="highlight">Hub</span></span>
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to your account</p>
            </div>

            <div id="errorMsg" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                    Sign In
                </button>
            </form>

        
<div class="auth-footer">
    <p style="margin-bottom: 8px;"><a href="/forgot-password" style="color: var(--primary); font-size: 0.9rem;">Forgot your password?</a></p>
    <p>Don't have an account? <a href="/register">Sign up</a></p>
</div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
