<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ShopHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <i class="fas fa-store"></i>
                    <span>Shop<span class="highlight">Hub</span></span>
                </a>
                <h2>Reset Password</h2>
                <p>Enter the code sent to <strong id="displayEmail">{{ email }}</strong> and your new password.</p>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="resetPasswordForm">
                <input type="hidden" id="email" value="{{ email }}">
                
                <div class="form-group">
                    <label>6-Digit Reset Code</label>
                    <input type="text" id="resetCode" required placeholder="123456" maxlength="6" style="letter-spacing: 4px; font-size: 1.2rem; text-align: center;">
                </div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" required placeholder="••••••••" minlength="8">
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••" minlength="8">
                </div>

                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                    Reset Password
                </button>
            </form>

            <div class="auth-footer">
                <a href="/login">Back to Login</a>
            </div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
