<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - ShopHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="/" class="logo" style="justify-content: center; margin-bottom: 20px;">
                    <i class="fas fa-store"></i>
                    <span>Shop<span class="highlight">Hub</span></span>
                </a>
                <h2>Verify Your Email</h2>
                <p>Enter the 6-digit code sent to <strong id="displayEmail">{{ email }}</strong></p>
            </div>

            <div id="errorMsg" class="error-message"></div>
            <div id="successMsg" class="success-message"></div>

            <form id="verifyForm">
                <input type="hidden" id="email" value="{{ email }}">
                <div class="code-inputs">
                    <input type="text" maxlength="1" class="code-digit" required>
                    <input type="text" maxlength="1" class="code-digit" required>
                    <input type="text" maxlength="1" class="code-digit" required>
                    <input type="text" maxlength="1" class="code-digit" required>
                    <input type="text" maxlength="1" class="code-digit" required>
                    <input type="text" maxlength="1" class="code-digit" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn" id="submitBtn">
                    Verify Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Didn't receive the code?</p>
                <button id="resendBtn" class="btn btn-outline" style="margin-top: 10px; width: 100%;" onclick="resendCode()">
                    Resend Code
                </button>
                <p id="resendTimer" style="display: none; margin-top: 10px; color: var(--text-muted); font-size: 0.85rem;">
                    You can request a new code in <span id="countdown">60</span> seconds
                </p>
            </div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>
